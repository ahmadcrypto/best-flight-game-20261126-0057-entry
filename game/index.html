<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:,">
<title>Senja Skies — Langit Senja</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #17102e;
    font-family: system-ui, -apple-system, sans-serif;
    color: #fff3dd;
  }
  #wrap {
    position: relative;
    width: 1280px;
    max-width: 100vw;
    margin: 0 auto;
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    background: #2e1a5e;
  }
  .controls {
    position: absolute;
    right: 14px;
    bottom: 14px;
    display: flex;
    gap: 8px;
    z-index: 2;
  }
  .controls button {
    width: 64px;
    height: 56px;
    border: 1px solid rgba(255, 190, 120, 0.55);
    border-radius: 12px;
    background: rgba(14, 10, 30, 0.72);
    color: #ffd9a0;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .controls button.held {
    background: rgba(255, 190, 120, 0.4);
    color: #fff3dd;
  }
  .hint {
    max-width: 1280px;
    margin: 8px auto 24px;
    padding: 0 12px;
    color: #c9b8a3;
    font-size: 14px;
    line-height: 1.5;
  }
  .hint b { color: #ffb85c; }
  /* Screenshot mode: no buttons, no hint — just the game. */
  body.shot .controls, body.shot .hint { display: none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div class="controls">
    <button id="btn-thr-down" title="Kurangi throttle (S)">THR−</button>
    <button id="btn-thr-up" title="Tambah throttle (W)">THR+</button>
    <button id="btn-descend" title="Menukik (A)">▼</button>
    <button id="btn-climb" title="Mendaki (D)">▲</button>
  </div>
</div>
<p class="hint"><b>Senja Skies</b> — W/S throttle, A/D naik-turun, 1/2/3 pilih misi, R ulangi, P jeda, M suara. Lepas landas dari runway, lewati ring, mendarat dengan selamat.</p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
